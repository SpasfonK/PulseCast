name: Build PulseCast APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build à produire"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilation Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Le dépôt ne contient pas de gradle-wrapper.jar binaire précompilé
      # (voir PHASE1_NOTES.md pour la justification). Cette action installe
      # une distribution Gradle officielle sur le runner, ce qui permet de
      # (re)générer un wrapper propre et à jour à chaque exécution.
      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache des dépendances Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Génération du Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Autoriser l'exécution du wrapper Gradle
        run: chmod +x ./gradlew

      - name: Compilation debug
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Compilation release (non signée)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Localisation de l'APK généré
        id: locate_apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "Chemin de l'APK détecté : $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publication de l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: pulsecast-${{ github.event.inputs.build_type }}-${{ github.run_number }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
